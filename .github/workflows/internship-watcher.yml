name: Internship watcher

on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub throttles schedules; expect ~10–30 min in practice
  workflow_dispatch:
    inputs:
      mode:
        description: "run | seed | check-targets | dry-run"
        default: "run"
        required: true

permissions:
  contents: write

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            seed)          python watcher.py --seed ;;
            check-targets) python watcher.py --check-targets ;;
            dry-run)       python watcher.py --dry-run ;;
            *)             python watcher.py ;;
          esac

      - name: Persist state
        if: github.event.inputs.mode != 'check-targets' && github.event.inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.json
          for attempt in 1 2 3 4; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"      # take whatever is newest on main (config edits etc.)
            cp /tmp/state.json state.json                    # ...and put this run's state on top
            git add state.json
            if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:"$GITHUB_REF_NAME"; then exit 0; fi
            echo "push rejected (attempt $attempt), retrying"; sleep $((RANDOM % 8 + 2))
          done
          echo "could not push state after 4 attempts"; exit 1
