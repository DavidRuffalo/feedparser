name: Internship watcher

on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub throttles schedules; expect ~10–30 min in practice
  workflow_dispatch:
    inputs:
      mode:
        description: "run | seed | check-targets | dry-run"
        default: "run"
        required: true

permissions:
  contents: write

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODE: ${{ github.event.inputs.mode || 'run' }}
        run: |
          case "$MODE" in
            seed)          python watcher.py --seed ;;
            check-targets) python watcher.py --check-targets ;;
            dry-run)       python watcher.py --dry-run ;;
            *)             python watcher.py ;;
          esac

      - name: Persist state
        if: github.event.inputs.mode != 'check-targets' && github.event.inputs.mode != 'dry-run'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
