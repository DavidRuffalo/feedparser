name: Internship watcher

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay scheduled runs)
  workflow_dispatch:         # lets you trigger manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python watcher.py

      - name: Persist seen commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_commits.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen commits"
            git push
          fi
